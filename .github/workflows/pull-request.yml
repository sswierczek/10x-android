name: Pull Request Status Comment

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_run:
    workflows:
      - 'Android CI'
      - 'Code Quality'
      - 'Android Connected Tests'
    types:
      - completed
      - requested

jobs:
  pr-comment:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || github.event.workflow_run.conclusion != '' }}
    permissions:
      pull-requests: write
      actions: read

    steps:
      - name: Get PR number
        id: get-pr
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber;
            if (context.eventName === 'pull_request') {
              prNumber = context.payload.pull_request.number;
            } else if (context.eventName === 'workflow_run') {
              const allPRs = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open'
              });
              const pr = allPRs.data.find(pr => {
                return pr.head.sha === context.payload.workflow_run.head_sha;
              });
              prNumber = pr ? pr.number : null;
            }
            return prNumber;
          result-encoding: string

      - name: Get workflow statuses
        id: get-status
        if: steps.get-pr.outputs.result != ''
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.eventName === 'pull_request' 
              ? context.payload.pull_request.head.sha 
              : context.payload.workflow_run.head_sha;
            
            const workflows = ['Android CI', 'Code Quality', 'Android Connected Tests'];
            const statuses = {};
            
            for (const workflow of workflows) {
              try {
                const workflowId = workflow.toLowerCase().replace(/ /g, '-');
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: workflowId + '.yml',
                  head_sha: sha,
                  per_page: 1
                });
                
                if (runs.data.total_count > 0) {
                  const run = runs.data.workflow_runs[0];
                  statuses[workflow] = {
                    conclusion: run.conclusion || run.status,
                    status: run.status,
                    url: run.html_url
                  };
                } else {
                  const runsWithoutExt = await github.rest.actions.listWorkflowRuns({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    workflow_id: workflowId,
                    head_sha: sha,
                    per_page: 1
                  });
                  
                  if (runsWithoutExt.data.total_count > 0) {
                    const run = runsWithoutExt.data.workflow_runs[0];
                    statuses[workflow] = {
                      conclusion: run.conclusion || run.status,
                      status: run.status,
                      url: run.html_url
                    };
                  } else {
                    statuses[workflow] = {
                      conclusion: 'pending',
                      status: 'pending',
                      url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/${workflowId}.yml`
                    };
                  }
                }
              } catch (error) {
                statuses[workflow] = {
                  conclusion: 'unknown',
                  status: 'unknown',
                  url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions`
                };
              }
            }
            
            const jsonString = JSON.stringify(statuses);
            console.log('Status JSON:', jsonString);
            
            if (!jsonString) {
              throw new Error('Failed to generate status JSON');
            }
            
            core.setOutput('status-json', jsonString);
            return jsonString;

      - name: Create or update status comment
        if: steps.get-pr.outputs.result != ''
        uses: actions/github-script@v7
        with:
          script: |
            const statusJson = '${{ steps.get-status.outputs.status-json }}';
            console.log('Received status JSON:', statusJson);
            
            if (!statusJson) {
              throw new Error('No status data received from previous step');
            }
            
            let statuses;
            try {
              statuses = JSON.parse(statusJson);
              console.log('Parsed statuses:', statuses);
            } catch (error) {
              console.error('Failed to parse status JSON:', error);
              throw error;
            }
            
            const statusEmoji = {
              success: '✅',
              failure: '❌',
              cancelled: '⚪',
              skipped: '⏭️',
              pending: '⏳',
              in_progress: '🔄',
              unknown: '❓'
            };
            
            const statusTranslations = {
              success: 'zakończone',
              failure: 'błąd',
              pending: 'w toku',
              in_progress: 'w trakcie',
              cancelled: 'anulowane',
              skipped: 'pominięte',
              unknown: 'nieznane'
            };
            
            let comment = '## Status kontroli CI\n\n';
            comment += '| Workflow | Status |\n';
            comment += '|----------|--------|\n';
            
            for (const [workflow, status] of Object.entries(statuses)) {
              const emoji = statusEmoji[status.conclusion] || '❓';
              const displayStatus = statusTranslations[status.conclusion] || 'nieznane';
              comment += `| [${workflow}](${status.url}) | ${emoji} ${displayStatus} |\n`;
            }
            
            comment += '\n\n<details><summary>ℹ️ Informacje o kontroli</summary>\n\n';
            comment += '* Ten komentarz jest automatycznie aktualizowany gdy workflow CI się zakończy\n';
            comment += '* Status jest oparty na najnowszym przebiegu dla aktualnego commita\n';
            comment += `* Ostatnia aktualizacja: ${new Date().toLocaleString('pl-PL')}\n`;
            comment += '</details>';
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.get-pr.outputs.result }}
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Status kontroli CI')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ${{ steps.get-pr.outputs.result }},
                body: comment
              });
            } 