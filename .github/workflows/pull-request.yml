name: Pull Request Status Comment

on:
  workflow_run:
    workflows: ['Android CI', 'Code Quality', 'Android Connected Tests']
    types:
      - completed
  pull_request_target:
    types: [opened, reopened, synchronize]

jobs:
  status-comment:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != ''
    permissions:
      pull-requests: write
      actions: read

    steps:
      - name: Get PR number
        uses: actions/github-script@v7
        id: get-pr
        with:
          script: |
            const allPRs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });
            const pr = allPRs.data.find(pr => {
              return pr.head.sha === context.payload.workflow_run.head_sha;
            });
            return pr ? pr.number : null;
          result-encoding: string

      - name: Get workflow statuses
        id: get-status
        uses: actions/github-script@v7
        with:
          script: |
            const workflows = ['Android CI', 'Code Quality', 'Android Connected Tests'];
            const statuses = {};
            
            for (const workflow of workflows) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow.toLowerCase().replace(/ /g, '-'),
                head_sha: context.payload.workflow_run.head_sha,
                per_page: 1
              });
              
              if (runs.data.total_count > 0) {
                const run = runs.data.workflow_runs[0];
                statuses[workflow] = {
                  conclusion: run.conclusion,
                  status: run.status,
                  url: run.html_url
                };
              }
            }
            return statuses;

      - name: Create status comment
        if: steps.get-pr.outputs.result != ''
        uses: actions/github-script@v7
        with:
          script: |
            const statuses = ${{ steps.get-status.outputs.result }};
            const statusEmoji = {
              success: '✅',
              failure: '❌',
              cancelled: '⚪',
              skipped: '⏭️',
              pending: '⏳',
              in_progress: '🔄'
            };
            
            let comment = '## CI Status Update\n\n';
            comment += '| Workflow | Status |\n';
            comment += '|----------|--------|\n';
            
            for (const [workflow, status] of Object.entries(statuses)) {
              const emoji = statusEmoji[status.conclusion] || '❓';
              comment += `| [${workflow}](${status.url}) | ${emoji} ${status.conclusion} |\n`;
            }
            
            comment += '\n\n<details><summary>ℹ️ About this check</summary>\n\n';
            comment += '* This comment is automatically updated when CI workflows complete\n';
            comment += '* Status is based on the latest run for the current commit\n';
            comment += '</details>';
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.get-pr.outputs.result }}
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('CI Status Update')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ${{ steps.get-pr.outputs.result }},
                body: comment
              });
            } 