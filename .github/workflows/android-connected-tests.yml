name: Android Connected Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  connected-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create google-services.json
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
          echo "Created google-services.json file in app/"

      - name: Create local.properties file
        run: |
          cat << EOF > local.properties
          sdk.dir=/usr/local/lib/android/sdk
          TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
          OPEN_ROUTER_KEY=${{ secrets.OPEN_ROUTER_KEY }}
          TESTUSER_PASSWORD='${{ secrets.TESTUSER_PASSWORD }}'
          EOF
          echo "Created local.properties file with all secrets"

      - name: Build debug APK and test APK
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install emulator packages
        run: |
          sdkmanager --install "system-images;android-29;google_apis;x86_64"
          sdkmanager --install "platforms;android-29"
          sdkmanager --install "build-tools;29.0.3"

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-api29-v1

      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          force-avd-creation: ${{ steps.avd-cache.outputs.cache-hit != 'true' }}
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          disable-animations: true
          script: |
            # Increase ADB timeout and retry settings
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            
            # Wait for the emulator to fully boot
            adb wait-for-device
            adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
            
            # Additional stability wait
            sleep 10
            
            # Start logcat capture
            adb logcat > logcat.txt &
            
            # Run the tests with increased timeout
            ./gradlew connectedDebugAndroidTest --info --no-daemon --max-workers=2 -Pandroid.testInstrumentationRunnerArguments.timeout_msec=60000

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
            logcat.txt
