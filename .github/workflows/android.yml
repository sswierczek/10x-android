name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create local.properties file
      run: |
        printf "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}\n" > local.properties
        printf "OPEN_ROUTER_KEY=${{ secrets.OPEN_ROUTER_KEY }}\n" >> local.properties
        printf "TESTUSER_PASSWORD=${{ secrets.TESTUSER_PASSWORD }}\n" >> local.properties
        echo "Created local.properties file with all secrets"

    - name: Create google-services.json
      run: |
        echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
        echo "Created google-services.json file in app/"

    - name: Make Gradle wrapper executable
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3

    - name: Build app
      run: ./gradlew assembleDebug

    - name: Generate version name
      id: version
      run: |
        VERSION_NAME=$(grep "versionName" app/build.gradle.kts | awk '{print $3}' | tr -d '"')
        echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

    - name: Upload Debug APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create GitHub Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version }}-${{ steps.version.outputs.date }}
        name: Release v${{ steps.version.outputs.version }} (${{ steps.version.outputs.date }})
        draft: false
        prerelease: false
        files: |
          app/build/outputs/apk/debug/app-debug.apk
        body: |
          ## MovieMind Release v${{ steps.version.outputs.version }}
          
          ### 📱 Debug APK
          - 🔧 [Debug APK](../../releases/download/v${{ steps.version.outputs.version }}-${{ steps.version.outputs.date }}/app-debug.apk)
          
          ### 📋 Build Information
          - Build Date: ${{ steps.version.outputs.date }}
          - Version: ${{ steps.version.outputs.version }}
          - Branch: main
          
          ### 🔍 Notes
          - This debug build includes additional logging and developer options
          - Built from main branch commit ${{ github.sha }}
