name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create local.properties with TMDB API key
      run: |
        echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}/n" > local.properties
        echo "Created local.properties file with TMDB API key"

    - name: Create local.properties with OPEN_ROUTER_KEY
      run: |
        echo "OPEN_ROUTER_KEY=${{ secrets.OPEN_ROUTER_KEY }}" >> local.properties
        echo "Created local.properties file with OPEN_ROUTER_KEY"

    - name: Create local.properties with TESTUSER_PASSWORD
      run: |
          echo "TESTUSER_PASSWORD=${{ secrets.TESTUSER_PASSWORD }}" >> local.properties
          echo "Created local.properties file with TESTUSER_PASSWORD"

    - name: Create google-services.json
      run: |
        echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
        echo "Created google-services.json file in app/"

    - name: Make Gradle wrapper executable
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3

    - name: Build app
      run: ./gradlew assembleDebug

    # This step uploads the debug APK as an artifact that can be downloaded from the Actions tab
    # The artifact will be available under the name "app-debug" in the workflow run
    # For instructions on downloading artifacts, see the workflow documentation in README.md
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 5
        overwrite: true
