name: Pull Request Status Comment

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_run:
    workflows:
      - 'Android CI'
      - 'Code Quality'
      - 'Android Connected Tests'
    types:
      - completed

jobs:
  pr-comment:
    runs-on: ubuntu-latest
    # Skip if the event is workflow_run but conclusion is empty
    if: ${{ github.event_name == 'pull_request' || github.event.workflow_run.conclusion != '' }}
    permissions:
      pull-requests: write
      actions: read

    steps:
      - name: Get PR number
        id: get-pr
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber;
            if (context.eventName === 'pull_request') {
              prNumber = context.payload.pull_request.number;
            } else if (context.eventName === 'workflow_run') {
              const allPRs = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open'
              });
              const pr = allPRs.data.find(pr => {
                return pr.head.sha === context.payload.workflow_run.head_sha;
              });
              prNumber = pr ? pr.number : null;
            }
            return prNumber;
          result-encoding: string

      - name: Get workflow statuses
        id: get-status
        if: steps.get-pr.outputs.result != ''
        uses: actions/github-script@v7
        with:
          script: |
            const workflows = ['Android CI', 'Code Quality', 'Android Connected Tests'];
            const statuses = {};
            
            for (const workflow of workflows) {
              try {
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: workflow.toLowerCase().replace(/ /g, '-'),
                  head_sha: context.eventName === 'pull_request' 
                    ? context.payload.pull_request.head.sha 
                    : context.payload.workflow_run.head_sha,
                  per_page: 1
                });
                
                if (runs.data.total_count > 0) {
                  const run = runs.data.workflow_runs[0];
                  statuses[workflow] = {
                    conclusion: run.conclusion || 'pending',
                    status: run.status,
                    url: run.html_url
                  };
                } else {
                  statuses[workflow] = {
                    conclusion: 'pending',
                    status: 'pending',
                    url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/${workflow.toLowerCase().replace(/ /g, '-')}.yml`
                  };
                }
              } catch (error) {
                console.log(`Error fetching status for ${workflow}:`, error);
                statuses[workflow] = {
                  conclusion: 'unknown',
                  status: 'unknown',
                  url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions`
                };
              }
            }
            return statuses;

      - name: Create or update status comment
        if: steps.get-pr.outputs.result != ''
        uses: actions/github-script@v7
        with:
          script: |
            const statuses = ${{ steps.get-status.outputs.result }};
            const statusEmoji = {
              success: '✅',
              failure: '❌',
              cancelled: '⚪',
              skipped: '⏭️',
              pending: '⏳',
              in_progress: '🔄',
              unknown: '❓'
            };
            
            let comment = '## Status kontroli CI\n\n';
            comment += '| Workflow | Status |\n';
            comment += '|----------|--------|\n';
            
            for (const [workflow, status] of Object.entries(statuses)) {
              const emoji = statusEmoji[status.conclusion] || '❓';
              comment += `| [${workflow}](${status.url}) | ${emoji} ${status.conclusion} |\n`;
            }
            
            comment += '\n\n<details><summary>ℹ️ Informacje o kontroli</summary>\n\n';
            comment += '* Ten komentarz jest automatycznie aktualizowany gdy workflow CI się zakończy\n';
            comment += '* Status jest oparty na najnowszym przebiegu dla aktualnego commita\n';
            comment += `* Ostatnia aktualizacja: ${new Date().toLocaleString('pl-PL')}\n`;
            comment += '</details>';
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.get-pr.outputs.result }}
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Status kontroli CI')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ${{ steps.get-pr.outputs.result }},
                body: comment
              });
            } 