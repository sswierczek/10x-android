name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create google-services.json
      run: |
        echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
        echo "Created google-services.json file in app/"

    - name: Build app
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: wrapper
        arguments: assembleDebug
        cache-read-only: false
        cache-enabled: true
        cache-key-prefix: android

    # This step uploads the debug APK as an artifact that can be downloaded from the Actions tab
    # The artifact will be available under the name "app-debug" in the workflow run
    # For instructions on downloading artifacts, see the workflow documentation in README.md
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 5
        overwrite: true
